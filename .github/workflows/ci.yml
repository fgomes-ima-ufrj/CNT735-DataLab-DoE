name: CNT735 DoE - Testes
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compilação
        run: python -m compileall -q app.py cnt735 tests scripts
      - name: Suite completa
        run: python -m pytest -q
      - name: Reprodutibilidade numérica
        run: python -m scripts.checar_baseline
